name: Terraform_CI_CD

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # 1. TERRAFORM VALIDATION
  # ============================================================

  terraform_validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout Code
      # --------------------------------------------------------

      - name: Checkout the code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: environment/dev
        run: terraform init


      # --------------------------------------------------------
      # Terraform Format Check
      # --------------------------------------------------------

      - name: Terraform Format Check
        working-directory: environment/dev
        run: terraform fmt -check


      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: environment/dev
        run: terraform validate



  # ============================================================
  # 2. TERRAFORM PLAN
  # ============================================================

  terraform_plan_preview:
    name: Terraform Plan
    needs: terraform_validation
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout Code
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: environment/dev
        run: terraform init


      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: environment/dev
        run: terraform plan -out=dev.tfplan -var-file=terraform.tfvars


      # --------------------------------------------------------
      # Generate Human Readable Plan
      # --------------------------------------------------------

      - name: Generate Human Readable Plan
        working-directory: environment/dev
        run: terraform show dev.tfplan > plan.txt


      # --------------------------------------------------------
      # Upload Terraform Plan
      # --------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            environment/dev/dev.tfplan
            environment/dev/plan.txt



  # ============================================================
  # 3. TERRAFORM APPLY
  # ONLY AFTER MERGE / PUSH TO MAIN
  # ============================================================

  terraform_apply:
    name: Terraform Apply

    needs: terraform_plan_preview

    # Apply ONLY when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment: dev

    steps:

      # --------------------------------------------------------
      # Checkout Code
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: environment/dev
        run: terraform init


      # --------------------------------------------------------
      # Create Plan for Apply
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: environment/dev
        run: terraform plan -out=dev.tfplan -var-file=terraform.tfvars


      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: environment/dev
        run: terraform apply -auto-approve dev.tfplan